<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>ESAN - Trayectoria histórica</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
</head>

<body>
  <a-scene>
    <a-assets>
      <img id="esan360" src="patio.jpg">
      <video id="videoUni" src="video2.mp4" preload="auto" loop="false" crossorigin="anonymous" playsinline webkit-playsinline></video>
    </a-assets>

    <a-sky src="#esan360" rotation="0 -90 0"></a-sky>

    <a-sphere
      id="telonNegro"
      radius="60"
      material="color: #000; side: back; transparent: true; opacity: 0; shader: flat"
      animation__oscurecer="property: material.opacity; to: 1; dur: 2000; startEvents: cineStart"
      animation__aclarar="property: material.opacity; to: 0; dur: 2000; startEvents: cineEnd">
    </a-sphere>

    <a-entity id="grupoVideo" position="0 1.6 -4" visible="false">
      <a-video id="pantallaVideo" src="#videoUni" width="5" height="3"></a-video>

      <a-entity id="controles" position="0 -1.9 0.1">
        <a-circle id="btnReset" class="clickable" color="#FFFFFF" radius="0.2" position="-1.2 0 0">
          <a-text value="REINICIO" align="center" color="#000000" width="2"></a-text>
        </a-circle>

        <a-circle id="btnNormal" class="clickable" color="#FFFFFF" radius="0.2" position="-0.6 0 0">
          <a-text value="1x" align="center" color="#FF0000" width="3"></a-text>
        </a-circle>

        <a-circle id="btnPausa" class="clickable" color="#FF0000" radius="0.25" position="0 0 0">
          <a-text id="txtPausa" value="PAUSA" align="center" color="#FFFFFF" width="2"></a-text>
        </a-circle>

        <a-circle id="btnRapido" class="clickable" color="#FFFFFF" radius="0.2" position="0.6 0 0">
          <a-text value="2x >>" align="center" color="#FF0000" width="3"></a-text>
        </a-circle>
        
        <a-circle id="btnSalir" class="clickable" color="#FF0000" radius="0.2" position="1.3 0 0">
          <a-text value="X" align="center" color="#FFFFFF" width="3"></a-text>
        </a-circle>
      </a-entity>
    </a-entity>

    <a-entity
      id="contenedorBoton"
      position="0 1.6 -15"
      visible="true"
      animation="property: position; to: 0 1.6 -2.5; dur: 8000; easing: easeOutCubic; delay: 500">

      <a-circle id="btnAccion" class="clickable" color="#000000" opacity="0.6" radius="0.65">
        <a-text id="textoBoton" value="CONOCE NUESTRA\nHISTORIA" align="center" color="#FFFFFF" width="1" wrap-count="20"></a-text>
      </a-circle>
    </a-entity>

    <a-entity camera look-controls position="0 1.6 0">
      <a-cursor color="#FFD700" scale="0.5 0.5 0.5" raycaster="objects: .clickable"></a-cursor>
    </a-entity>
  </a-scene>

  <script>
    const video = document.querySelector('#videoUni');
    const grupoVideo = document.querySelector('#grupoVideo');
    const contenedorBtn = document.querySelector('#contenedorBoton');
    const textoBoton = document.querySelector('#textoBoton');
    const telon = document.querySelector('#telonNegro');
    const txtPausa = document.querySelector('#txtPausa');

    // Aparecer lentamente al cargar (Duración de 2.5 segundos)
    window.onload = () => {
      setTimeout(() => {
        contenedorBtn.emit('animarBoton');
      }, 800);
    };

    document.querySelector('#btnAccion').addEventListener('click', () => {
      // Desaparecer rápido para iniciar video
      contenedorBtn.setAttribute('scale', '0.001 0.001 0.001');
      contenedorBtn.setAttribute('visible', 'false');
      
      telon.emit('cineStart');
      
      setTimeout(() => {
        grupoVideo.setAttribute('visible', 'true');
        video.play();
      }, 1500);
    });

    function volverAlMenu() {
      video.pause();
      video.currentTime = 0;
      grupoVideo.setAttribute('visible', 'false');
      telon.emit('cineEnd');

      // Actualizar texto y disparar animación lenta de nuevo
      textoBoton.setAttribute('value', 'VUELVE A VER\nNUESTRA HISTORIA');
      contenedorBtn.setAttribute('visible', 'true');
      contenedorBtn.emit('animarBoton');
    }

    // Botón RESET (vuelve al inicio del video)
    document.querySelector('#btnReset').addEventListener('click', () => {
      video.currentTime = 0;
      video.play();
      txtPausa.setAttribute('value', 'PAUSA');
    });

    document.querySelector('#btnSalir').addEventListener('click', volverAlMenu);
    video.addEventListener('ended', volverAlMenu);

    document.querySelector('#btnPausa').addEventListener('click', () => {
      if (video.paused) { video.play(); txtPausa.setAttribute('value', 'PAUSA'); }
      else { video.pause(); txtPausa.setAttribute('value', 'PLAY'); }
    });

    document.querySelector('#btnNormal').addEventListener('click', () => { video.playbackRate = 1.0; });
    document.querySelector('#btnRapido').addEventListener('click', () => { video.playbackRate = 4.0; });
  </script>
</body>
</html>
